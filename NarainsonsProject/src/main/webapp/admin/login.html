<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Narainsons</title>
  <script>
    (function () {
      var path = location.pathname || "/";
      var idx = path.indexOf("/admin/");
      var base = idx >= 0
        ? path.substring(0, idx + "/admin/".length)
        : path.replace(/\/index\.html$/i, "/").replace(/\/?$/, "/") + "admin/";
      var el = document.createElement("base");
      el.href = base;
      document.head.appendChild(el);
    })();
  </script>
  <link rel="stylesheet" href="assets/css/admin-shell.css">
</head>
<body class="ns-auth" data-context="login">
  <script src="assets/js/config.js"></script>
  <div class="ns-auth-card">
    <div class="ns-auth-card__head">
      <img class="ns-auth-card__logo" src="assets/img/logo.jpg" alt="Narainsons">
      <h1 class="ns-auth-card__title">Admin Panel</h1>
      <p class="ns-auth-card__sub">Sign in with your admin account</p>
    </div>
    <div class="ns-auth-card__body">
      <form id="login-form" novalidate>
        <div class="ns-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="admin@example.com" autocomplete="email" required>
        </div>
        <div class="ns-field">
          <label for="password">Password</label>
          <div class="ns-input-wrap">
            <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="ns-input-wrap__toggle" data-toggle-for="password" aria-label="Show password" aria-pressed="false" title="Show password">
              <svg class="ns-eye-icon ns-eye-icon--show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3.25"/></svg>
              <svg class="ns-eye-icon ns-eye-icon--hide hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.07 10.07 0 0 1 12 5c7 0 10 7 10 7a14.2 14.2 0 0 1-2.08 3.15"/><path d="M6.61 6.61A14.2 14.2 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
            </button>
          </div>
        </div>
        <p class="ns-link-row"><a href="admin-forgot-password.html">Forgot password?</a></p>
        <button type="submit" class="ns-btn ns-btn--primary" id="btn-login">Sign in</button>
      </form>
      <div id="auth-message" class="ns-toast hidden"></div>
    </div>
  </div>
  <script src="assets/js/admin-shell.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
