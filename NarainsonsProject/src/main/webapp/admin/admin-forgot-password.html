<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — Narainsons Admin</title>
  <link rel="stylesheet" href="assets/css/admin-shell.css">
</head>
<body class="ns-auth" data-context="admin-forgot">
  <script src="assets/js/config.js"></script>
  <div class="ns-auth-card">
    <div class="ns-auth-card__head">
      <img class="ns-auth-card__logo" src="assets/img/logo.jpg" alt="Narainsons">
      <h1 class="ns-auth-card__title">Reset password</h1>
      <p class="ns-auth-card__sub">Admin account OTP verification</p>
    </div>
    <div class="ns-auth-card__body">
      <div class="ns-field">
        <label for="email">Admin email</label>
        <input id="email" type="email" autocomplete="email" required>
      </div>
      <button type="button" class="ns-btn ns-btn--primary" id="btn-admin-send-otp">Send OTP</button>
      <div id="admin-reset-section" class="hidden">
        <div class="ns-field">
          <label for="otp">OTP</label>
          <input id="otp" type="text" maxlength="6" inputmode="numeric">
        </div>
        <div class="ns-field">
          <label for="new-password">New password</label>
          <div class="ns-input-wrap">
            <input id="new-password" type="password" minlength="8" autocomplete="new-password">
            <button type="button" class="ns-input-wrap__toggle" data-toggle-for="new-password" aria-label="Show password" aria-pressed="false" title="Show password">
              <svg class="ns-eye-icon ns-eye-icon--show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3.25"/></svg>
              <svg class="ns-eye-icon ns-eye-icon--hide hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.07 10.07 0 0 1 12 5c7 0 10 7 10 7a14.2 14.2 0 0 1-2.08 3.15"/><path d="M6.61 6.61A14.2 14.2 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
            </button>
          </div>
        </div>
        <button type="button" class="ns-btn ns-btn--primary" id="btn-admin-reset">Update password</button>
      </div>
      <p class="ns-auth-back"><a href="login.html">Back to admin login</a></p>
      <div id="auth-message" class="ns-toast hidden"></div>
    </div>
  </div>
  <script src="assets/js/admin-shell.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
