<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — Narainsons App</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-context="forgot">
  <script src="assets/js/config.js"></script>

  <div class="auth-page">
    <div class="auth-card auth-card--compact">
      <div class="auth-card__header auth-card__header--white">
        <img class="auth-card__logo auth-card__logo--sm" src="assets/img/logo.jpg" alt="Logo">
        <h1 class="auth-card__title auth-card__title--sm">Reset password</h1>
      </div>
      <div class="auth-card__body auth-card__body--compact">
        <p class="auth-step-label" id="step-label">Step 1 — Email</p>

        <div class="form-group form-group--compact">
          <label for="email">Registered email</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
        </div>

        <div id="otp-section" class="hidden">
          <div class="form-group form-group--compact">
            <label for="otp">Verification code (email)</label>
            <input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="6 digit OTP">
          </div>
        </div>

        <div id="password-section" class="hidden">
          <div class="form-group form-group--compact">
            <label for="new-password">New password</label>
            <div class="input-wrap">
              <input id="new-password" type="password" placeholder="Min 8 characters" autocomplete="new-password">
              <button type="button" class="input-wrap__toggle" data-toggle-for="new-password" aria-label="Show password">
                <svg class="icon-eye icon-eye--show" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-eye icon-eye--hide hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>
          <div class="form-group form-group--compact">
            <label for="confirm-password">Confirm password</label>
            <div class="input-wrap">
              <input id="confirm-password" type="password" placeholder="Repeat password" autocomplete="new-password">
              <button type="button" class="input-wrap__toggle" data-toggle-for="confirm-password" aria-label="Show password">
                <svg class="icon-eye icon-eye--show" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-eye icon-eye--hide hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>
        </div>

        <button type="button" class="btn btn-primary btn--compact" id="btn-send-otp">Send OTP to email</button>
        <button type="button" class="btn btn-gold btn--compact hidden" id="btn-reset" style="width:100%;margin-top:8px">Update password</button>

        <div id="auth-message" class="message hidden"></div>
        <a class="auth-back" href="login.html">← Back to login</a>
      </div>
    </div>
  </div>
  <script src="assets/js/app.js"></script>
</body>
</html>
