<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Narainsons</title>
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="login">
  <script src="assets/js/config.js"></script>
  <div class="admin-auth">
    <div class="admin-card">
      <h1>Admin Panel</h1>
      <p class="muted">Use an <strong>active</strong> admin email only. Customer app credentials will not work here.</p>
      <form id="login-form">
        <label>Email</label>
        <input id="email" type="email" required placeholder="heeralalzx2020@gmail.com" autocomplete="email">
        <label>Password</label>
        <input id="password" type="password" required autocomplete="current-password">
        <p class="links"><a href="forgot-password.html">Forgot password?</a></p>
        <button type="submit" class="btn">Login</button>
      </form>
      <div id="msg" class="msg hidden"></div>
    </div>
  </div>
  <script src="assets/js/admin.js"></script>
</body>
</html>
