<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Reset Password</title>
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="forgot">
  <script src="assets/js/config.js"></script>
  <div class="admin-auth">
    <div class="admin-card">
      <h1>Reset password</h1>
      <div id="step-email">
        <label>Admin email</label>
        <input id="email" type="email" required>
        <button type="button" class="btn" id="btn-send-otp">Send OTP</button>
      </div>
      <div id="step-reset" class="hidden">
        <label>OTP</label>
        <input id="otp" type="text" maxlength="6">
        <label>New password</label>
        <input id="new-password" type="password" minlength="8">
        <button type="button" class="btn" id="btn-reset">Update password</button>
      </div>
      <p class="links"><a href="login.html">Back to login</a></p>
      <div id="msg" class="msg hidden"></div>
    </div>
  </div>
  <script src="assets/js/admin.js"></script>
</body>
</html>
